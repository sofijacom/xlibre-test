name: 🏗️ Build and Release Void Linux Packages

env:
  TAG: workflow-${{ github.run_number }}
  SHA: ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      force_build:
        type: boolean
        description: "Принудительно запустить сборку (даже без изменений)"
        default: false
  push:
    branches:
      - main
    paths:
      - srcpkgs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. DETECT: Определяем, какие пакеты изменились
  # ─────────────────────────────────────────────────────────────
  detect:
    name: 🔍 Detect Changes (DEBUG)
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
      matrix: ${{ steps.changes.outputs.matrix }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: repo

      - name: Force build enabled?
        if: ${{ github.event.inputs.force_build }}
        run: |
          echo "⚠️ Принудительная сборка включена"
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "matrix=[{\"package\":\"test\"}]" >> $GITHUB_OUTPUT
          exit 0

      - name: Show current SHA
        run: |
          echo "🔍 Текущий SHA: ${{ env.SHA }}"
          cd repo
          echo "📦 Последние коммиты:"
          git log --oneline -5

      - name: Determine base SHA
        id: base_sha
        run: |
          cd repo
          latest_tag=$(git tag --list "workflow-*" | sort -V | tail -n1)
          echo "🏷️ Последний тег: $latest_tag"

          if [ -n "$latest_tag" ]; then
            base_sha=$(git rev-list --max-count=1 "$latest_tag")
            echo "✅ Найден тег: $latest_tag → $base_sha"
          else
            base_sha=$(git rev-list --max-parents=0 HEAD)
            echo "🌀 Нет тегов, используем первый коммит: $base_sha"
          fi
          echo "BASE_SHA=$base_sha" >> $GITHUB_ENV

      - name: Find changed packages
        id: changes
        run: |
          cd repo
          echo "🔍 Ищем изменения между $BASE_SHA и ${{ env.SHA }} в srcpkgs/**"

          # Покажем, что видит diff
          echo "📄 git diff-tree:"
          git diff-tree -r --no-renames --name-only --diff-filter=AM $BASE_SHA ${{ env.SHA }} -- 'srcpkgs/**' || echo "❌ Нет diff"

          changed=$(git diff-tree -r --no-renames --name-only --diff-filter=AM \
            $BASE_SHA ${{ env.SHA }} -- 'srcpkgs/**' | cut -d/ -f2 | sort -u)

          echo "📦 Изменённые пакеты: [$changed]"

          if [ -z "$changed" ]; then
            echo "❌ Нет изменений в srcpkgs/"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "matrix=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Формируем JSON
          matrix="["
          first=true
          for pkg in $changed; do
            echo "➕ Добавляем пакет: $pkg"
            if [ "$first" = true ]; then
              first=false
            else
              matrix="$matrix,"
            fi
            matrix="$matrix{\"package\":\"$pkg\"}"
          done
          matrix="$matrix]"

          echo "✅ matrix = $matrix"
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

      - name: Debug: Final outputs
        run: |
          echo "🔹 [DEBUG] has_changes: ${{ steps.changes.outputs.has_changes }}"
          echo "🔹 [DEBUG] matrix: ${{ steps.changes.outputs.matrix }}"

  # ─────────────────────────────────────────────────────────────
  # 2. BUILD: Собираем пакеты
  # ─────────────────────────────────────────────────────────────
  build:
    name: 🛠️ Build ${{ matrix.package.package }} (${{ matrix.config.arch }})
    needs: detect
    if: ${{ needs.detect.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: { arch: x86_64,       libc: glibc, platform: linux/amd64 }
          - config: { arch: x86_64-musl, libc: musl,  platform: linux/amd64 }
        package: ${{ fromJson(needs.detect.outputs.matrix) }}
    container:
      image: ghcr.io/void-linux/void-${{ matrix.config.libc }}-full:20250616R1
      options: --platform ${{ matrix.config.platform }} --privileged
      volumes:
        - /dev:/dev
    env:
      ARCH: ${{ matrix.config.arch }}
      PKG: ${{ matrix.package.package }}
    steps:
      - name: Cache masterdir
        id: cache-masterdir
        uses: actions/cache@v5
        with:
          path: masterdir-${{ matrix.config.arch }}
          key: masterdir-${{ matrix.config.arch }}-${{ hashFiles('common/xbps-src/shlibs') }}
          restore-keys: |
            masterdir-${{ matrix.config.arch }}-

      - name: Checkout void-packages
        uses: actions/checkout@v6
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages

      - name: Restore masterdir from cache
        if: steps.cache-masterdir.outputs.cache-hit == 'true'
        run: |
          mv masterdir-${{ matrix.config.arch }} void-packages/

      - name: Merge custom srcpkgs
        run: |
          cd void-packages
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global --add safe.directory "*"
          git remote add custom https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}.git
          git fetch custom
          git merge --no-commit --strategy-option=theirs --allow-unrelated-histories custom/main
          mkdir -p hostdir/binpkgs

      - name: Setup xbps
        run: |
          cd void-packages
          mkdir -p etc
          echo XBPS_BUILD_ENVIRONMENT=void-packages-ci >> etc/conf
          echo XBPS_ALLOW_RESTRICTED=yes >> etc/conf
          echo XBPS_CHROOT_CMD=uchroot >> etc/conf
          echo 'XBPS_REPOSITORY=$PWD/hostdir/binpkgs' >> etc/conf
          echo 'XBPS_DISTDIR=$PWD/hostdir/distfiles' >> etc/conf

      - name: Bootstrap masterdir
        run: |
          cd void-packages
          [ -d masterdir-${{ matrix.config.arch }} ] || sudo -Eu builder ./xbps-src -m masterdir-${{ matrix.config.arch }} -A ${{ matrix.config.arch }} binary-bootstrap

      - name: Install gawk in chroot
        run: |
          MASTERDIR="void-packages/masterdir-${{ matrix.config.arch }}"
          sudo mount --bind /proc "$MASTERDIR/proc" || true
          sudo mount --bind /dev "$MASTERDIR/dev" || true
          sudo mount --bind /sys "$MASTERDIR/sys" || true
          sudo chroot "$MASTERDIR" xbps-install -y gawk || { echo "❌ gawk install failed"; exit 1; }
          sudo umount "$MASTERDIR/proc" "$MASTERDIR/dev" "$MASTERDIR/sys" || true

      - name: Build package
        run: |
          cd void-packages
          echo "🏗️ Собираем $PKG для $ARCH..."
          if ! sudo -Eu builder ./xbps-src -m masterdir-${{ matrix.config.arch }} -A ${{ matrix.config.arch }} pkg "$PKG"; then
            echo "❌ Ошибка сборки $PKG"
            exit 1
          fi

      - name: Save masterdir to cache
        uses: actions/cache/save@v5
        if: steps.cache-masterdir.outputs.cache-hit != 'true'
        with:
          path: void-packages/masterdir-${{ matrix.config.arch }}
          key: ${{ steps.cache-masterdir.outputs.cache-primary-key }}

      - name: Upload built packages
        uses: actions/upload-artifact@v7
        with:
          name: binpkgs-${{ matrix.config.arch }}
          path: void-packages/hostdir/binpkgs
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # 3. SIGN: Подписываем репозиторий
  # ─────────────────────────────────────────────────────────────
  sign:
    name: 🔐 Sign Packages
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - x86_64
          - x86_64-musl
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: binpkgs-${{ matrix.arch }}
          path: binpkgs

      - name: Check if packages exist
        id: check
        run: |
          count=$(ls binpkgs/*.xbps 2>/dev/null | wc -l || echo 0)
          echo "📦 Найдено пакетов: $count"
          if [ "$count" -gt 0 ]; then
            echo "packages_exist=true" >> $GITHUB_OUTPUT
          else
            echo "packages_exist=false" >> $GITHUB_OUTPUT
          fi

      - name: Sign repo and packages
        if: steps.check.outputs.packages_exist == 'true'
        env:
          PRIVKEY: ${{ secrets.PRIV_KEY }}
          PASSPHRASE: ${{ secrets.SIGN_PASS }}
        run: |
          cd binpkgs
          echo "$PRIVKEY" > key.pem
          chmod 600 key.pem
          xbps-rindex --privkey key.pem --sign --signedby "void-repo-github" --verbose .
          xbps-rindex --privkey key.pem --sign-pkg --verbose *.xbps
          rm -f key.pem

          # Checksums
          for file in *.xbps; do
            sha256sum "$file" | cut -d' ' -f1 > "$file.sha256sum"
            sha512sum "$file" | cut -d' ' -f1 > "$file.sha512sum"
          done

      - name: Upload signed repo
        if: steps.check.outputs.packages_exist == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: signed-repo-${{ matrix.arch }}
          path: binpkgs/

  # ─────────────────────────────────────────────────────────────
  # 4. RELEASE: Создаём GitHub Release
  # ─────────────────────────────────────────────────────────────
  release:
    name: 🚀 Create Release
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check if any packages were built
        id: any-built
        run: |
          total=0
          for arch in x86_64 x86_64-musl; do
            count=$(ls signed-repo-$arch/*.xbps 2>/dev/null | wc -l || echo 0)
            total=$((total + count))
          done
          if [ $total -gt 0 ]; then
            echo "any_packages=true" >> $GITHUB_OUTPUT
          else
            echo "any_packages=false" >> $GITHUB_OUTPUT
          fi

      - name: Download all signed repos
        if: steps.any-built.outputs.any_packages == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: signed-repo-*
          merge-multiple: true
          path: repo

      - name: Generate changelog
        if: steps.any-built.outputs.any_packages == 'true'
        run: |
          echo "## 📝 Изменения в ${{ env.SHA }}" > diff.md
          git -C repo log --oneline ${{ env.SHA }}^..${{ env.SHA }} -- 'srcpkgs/**' >> diff.md

      - name: Create GitHub Release
        if: steps.any-built.outputs.any_packages == 'true'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.SHA }}
          tag_name: ${{ env.TAG }}
          body_path: diff.md
          files: repo/**
          draft: false
          prerelease: false
