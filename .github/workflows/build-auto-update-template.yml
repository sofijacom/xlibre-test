name: 🔄 Автообновление шаблонов

on:
  # 🕰 Запуск каждый день в 00:00 по Москве (21:00 UTC)
  schedule:
    - cron: '0 21 * * *'

  # 🎯 Запуск вручную (в веб-интерфейсе)
  workflow_dispatch:

  # 🔺 При push в srcpkgs/ — но не от бота (чтобы избежать цикла)
  push:
    branches: [main]
    paths:
      - 'srcpkgs/**'
    types: [created, edited]
    exclude:
      - actor: github-actions[bot]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Чтобы можно было делать git push

    steps:
      # 🔁 1. Checkout — клонируем твой репозиторий
      - name: 🔁 Checkout xlibre-test
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main

      # 🧪 2. Проверим, что скрипт есть
      - name: 🔍 Проверить структуру
        run: |
          echo "Текущая директория: $(pwd)"
          echo "Содержимое: $(ls -la)"
          if [[ ! -f "scripts/auto-update-all.sh" ]]; then
            echo "❌ Скрипт scripts/auto-update-all.sh не найден!"
            exit 1
          fi

      # 🔁 3. Запускаем автообновление
      - name: 🔁 Обновить шаблоны
        run: |
          chmod +x scripts/auto-update-all.sh
          ./scripts/auto-update-all.sh || echo "Нет обновлений или ошибка — это нормально"

      # 🔎 4. Проверим, были ли изменения
      - name: 🔎 Проверить изменения
        id: changes
        run: |
          if git diff --name-only --exit-code srcpkgs/*/template >/dev/null; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "✅ Нет изменений в шаблонах"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "📝 Обнаружены изменения:"
            git diff --name-only srcpkgs/*/template
          fi

      # 💾 5. Если были изменения — коммит и пуш
      - name: 💾 Запушить обновлённые шаблоны
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add srcpkgs/*/template
          git commit -m "🔄 Автообновление шаблонов $(date +%F)

          Обновлены:
          $(git diff --name-only --cached | sed 's/^/• /')

          Запущено автоматически."

          echo "📤 Пушим изменения в main..."
          git push origin main
