name: "🏗️ Build Latest Packages"

env:
  TAG: workflow-${{ github.run_number }}
  SHA: ${{ github.sha }}

on:
  push:
    branches: [main]
    paths: [srcpkgs/**]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Xlibre
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/void-linux/void-glibc-full:20250227R1
      options: --platform linux/amd64 --privileged

    strategy:
      matrix:
        arch: [ x86_64, i686, x86_64-musl, aarch64, aarch64-musl ]

    env:
      REPO_OWNER: "${{ github.repository_owner }}"
      REPO_NAME: "${{ github.event.repository.name }}"
      TARGET_ARCH: "${{ matrix.arch }}"
   #   XBPS_ALLOW_CHROOT_BREAKOUT: "1"
   #   XBPS_NO_UNSHARE: "1"

    steps:
      - name: 🔧 Подготовка системы
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps && xbps-install -yu
          xbps-install -y sudo bash git xtools coreutils
          useradd -m -G xbuilder builder -s /bin/bash
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          echo "✅ Система готова"

      - name: 🌐 Клонируем void-packages
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git /home/builder/void-packages
          chown -R builder:xbuilder /home/builder/void-packages

      - name: 📥 Клонируем мой репозиторий
        run: |
          git clone --depth=1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /work
          chown -R builder:xbuilder /work
          
      - name: 📦 binary-bootstrap
        run: |
          cd /home/builder/void-packages

          # 🔥 УДАЛЯЕМ РУЧНОЕ СОЗДАНИЕ masterdir — ПУСТЬ СОЗДАСТСЯ САМ
          # mkdir -p "$MASTERDIR/etc/xbps.d" — ❌ убираем

          # Запускаем bootstrap от builder — он сам создаст masterdir
          sudo -Eu builder \
            XBPS_NO_UNSHARE=1 \
            ./xbps-src -a "$TARGET_ARCH" -A "$TARGET_ARCH" binary-bootstrap

          echo "✅ base-chroot установлен"

      - name: 📝 Читаем список пакетов
        id: packages
        run: |
          if [ -f /work/srcpkgs-to-build.txt ]; then
            echo "list=$(cat /work/srcpkgs-to-build.txt | tr '\n' ' ')" >> $GITHUB_OUTPUT
          else
            echo "list=hello" >> $GITHUB_OUTPUT  # 🧪 Быстрый тест
          fi

      - name: 🚀 Сборка внутри chroot
        run: |
          cd /home/builder/void-packages
          MASTERDIR="masterdir-${TARGET_ARCH}"

          # Копируем srcpkgs
          cp -r /work/srcpkgs/* srcpkgs/ 2>/dev/null || true

          # Запускаем сборку ВНУТРИ chroot
          chroot "$MASTERDIR" /bin/sh -c "
            export HOME=/home/builder
            export USER=builder
            export XBPS_ALLOW_CHROOT_BREAKOUT=1
            cd /void-packages
            su - builder -c '
              for pkg in ${{ steps.packages.outputs.list }}; do
                echo \"🔧 Собираем: \$pkg\"
                ./xbps-src -a $TARGET_ARCH pkg \"\$pkg\" || exit 1
                echo \"✅ \$pkg собран\"
              done
            '
          "

          if [ $? -eq 0 ]; then
            echo "✅ Сборка завершена"
          else
            echo "❌ Ошибка сборки"
            exit 1
          fi
          
      - name: Clean & sign
        working-directory: /home/builder/void-packages/hostdir/binpkgs
        env:
          PRIVKEY: ${{ secrets.PRIV_KEY }}
          XBPS_PASSPHRASE: ${{ secrets.SIGN_PASS }}
        run: |
          sudo -Eu builder xbps-rindex --remove-obsoletes ${PWD}
          printf "%s\n" "${PRIVKEY}" > key.pem
          sudo -Eu builder xbps-rindex --privkey key.pem --sign --signedby "${REPO_NAME}-github-actions" --verbose ${PWD}
          sudo -Eu builder xbps-rindex --privkey key.pem --sign-pkg --verbose ${PWD}/*.xbps
          sudo -Eu builder rm -f key.pem
          sudo -Eu builder xbps-rindex --clean ${PWD}

      - name: checksum
        working-directory: /home/builder/void-packages/hostdir/binpkgs
        run: |
          rm -rf *.sha256sum *.sha512sum
          
          # Only run the loop if there are actually files ending in .xbps
          count=$(ls -1 *.xbps 2>/dev/null | wc -l)
          if [ "$count" != 0 ]; then
            for file in *.xbps; do
              sha256sum "${file}" | cut -d ' ' -f 1 > "${file}.sha256sum"
              sha512sum "${file}" | cut -d ' ' -f 1 > "${file}.sha512sum"
            done
          else
            echo "❌ No packages found to checksum."
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}-repodata
          path: /home/builder/void-packages/hostdir/binpkgs

      - name: short sha
        run: |
          printf "SHORT_SHA=$(git rev-parse --short ${SHA})" >> $GITHUB_ENV

      - name: release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.SHA }}
          tag_name: ${{ env.TAG }}
          files: |
            /home/builder/void-packages/hostdir/binpkgs/**/*.xbps
            /home/builder/void-packages/hostdir/binpkgs/**/*.sig2
            /home/builder/void-packages/hostdir/binpkgs/**/*repodata
