name: "🏗️ Build Latest Packages"

env:
  TAG: workflow-${{ github.run_number }}
  SHA: ${{ github.sha }}

on:
  push:
    branches: [main]
    paths: [srcpkgs/**]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build📦 ${{ matrix.config.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   

    strategy:
      fail-fast: false
      matrix:
        config:
          - { arch: x86_64,       host: x86_64,      libc: glibc, platform: linux/amd64, test: 1 }
          - { arch: i686,         host: i686,        libc: glibc, platform: linux/amd64, test: 1 }
          - { arch: x86_64-musl,  host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 1 }
          - { arch: aarch64,      host: aarch64,     libc: glibc, platform: linux/amd64, test: 0 }
          - { arch: aarch64-musl, host: aarch64-musl, libc: musl,  platform: linux/amd64, test: 0 }

    container:
      image: ghcr.io/void-linux/void-glibc-full:20250616R1
      options: --platform linux/amd64 --privileged
      volumes:
        - /dev:/dev
      env:
        TAG: '${{ env.TAG }}'
        SHA: '${{ env.SHA }}'
        ARCH: '${{ matrix.config.arch }}'
        XBPS_TARGET_ARCH: '${{ matrix.config.arch }}'
        REPO_OWNER: "${{ github.repository_owner }}"
        REPO_NAME: "${{ github.event.repository.name }}"

    if: ${{ github.ref == 'refs/heads/main' }}

    steps:    
      - name: 🔒 Block /void-packages with tmpfs
        run: |
          echo "🔒 Blocking /void-packages to prevent exec conflicts"
          sudo mkdir -p /tmp/empty-dir
          sudo mount --bind /tmp/empty-dir /void-packages
          sudo mount --make-private /void-packages
          echo "✅ /void-packages is now a blocked bind-mount"

      - name: 🐳 Prep container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          env -u XBPS_TARGET_ARCH xbps-install -Syu xbps
          env -u XBPS_TARGET_ARCH xbps-install -yu
          env -u XBPS_TARGET_ARCH xbps-install -y sudo bash curl git github-cli xtools coreutils qemu-user-static
          useradd -G xbuilder -M builder -s $(which bash)

      - name: 🔎 Clone void-packages
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git /tmp/void-packages-src
          cd /tmp/void-packages-src
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "*"
          git remote add -f sofijacom https://github.com/sofijacom/xlibre-test.git
          git merge --no-commit --strategy-option=theirs --allow-unrelated-histories -Xignore-space-change sofijacom/main

      - name: 📁 Move to /home/builder/void-packages
        run: |
          rm -rf /home/builder/void-packages
          mkdir -p /home/builder/void-packages
          cp -r /tmp/void-packages-src/. /home/builder/void-packages/
          chown -R builder:builder /home/builder/void-packages
          echo "✅ void-packages moved to /home/builder/void-packages"

      - name: 📋 Identify changes to build
        working-directory: /home/builder/void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_name=$(gh release view --json tagName --jq '.tagName' --repo sofijacom/xlibre-test || echo "Initial Commit")
          latest_sha=$(git rev-list --max-count=1 ${latest_name} 2>/dev/null || git rev-list --max-parents=0 sofijacom/main)
          echo "Latest Tag Name: ${latest_name}"
          echo "Latest Tag SHA: ${latest_sha}"

          git diff-tree -r --no-renames --name-only --diff-filter=AM ${latest_sha} ${SHA} -- 'srcpkgs/**' \
          | cut -d/ -f 2 | uniq | xargs sudo -Eu builder /home/builder/void-packages/xbps-src sort-dependencies | tee /tmp/templates

      - name: 📋 Setup void-packages
        working-directory: /home/builder/void-packages
        run: |
          mkdir -p etc
          echo XBPS_BUILD_ENVIRONMENT=void-packages-ci >> etc/conf
          echo XBPS_ALLOW_RESTRICTED=yes >> etc/conf
          echo XBPS_CHROOT_CMD=uchroot >> etc/conf
          echo 'XBPS_REPOSITORY=$PWD/hostdir/binpkgs' >> etc/conf
          echo 'XBPS_DISTDIR=$PWD/hostdir/distfiles' >> etc/conf
          echo 'XBPS_MASTERDIR_PKGS="$PWD/hostdir/binpkgs"' >> etc/conf

      - name: ✅ Fix execute permissions
        working-directory: /home/builder/void-packages
        run: |
          echo "🔧 Fixing execute permissions for xbps-src and templates"
          chmod +x xbps-src
          find srcpkgs -name template -type f -exec chmod +x {} \;

      - name: ✅ Prepare masterdir
        working-directory: /home/builder/void-packages
        run: |
          if [ "${{ matrix.config.arch }}" = "aarch64" ] || [ "${{ matrix.config.arch }}" = "aarch64-musl" ]; then
            echo "🔧 Bootstrapping masterdir for $ARCH using -a (cross)"
            sudo -Eu builder \
              XBPS_NO_UNSHARE=1 \
              XBPS_SRC_HOME=/home/builder/void-packages \
              bash /home/builder/void-packages/xbps-src -m masterdir-${{ matrix.config.arch }} -a ${{ matrix.config.arch }} binary-bootstrap
          else
            echo "🔧 Bootstrapping masterdir for $ARCH using -A (native)"
            sudo -Eu builder \
              XBPS_NO_UNSHARE=1 \
              XBPS_SRC_HOME=/home/builder/void-packages \
              bash /home/builder/void-packages/xbps-src -m masterdir-${{ matrix.config.arch }} -A ${{ matrix.config.arch }} binary-bootstrap
          fi

          if [ "${{ matrix.config.arch }}" = "aarch64" ] || [ "${{ matrix.config.arch }}" = "aarch64-musl" ]; then
            echo "🔧 Injecting qemu-aarch64-static into masterdir"
            mkdir -p /home/builder/void-packages/masterdir-${{ matrix.config.arch }}/usr/bin
            cp /usr/bin/qemu-aarch64-static /home/builder/void-packages/masterdir-${{ matrix.config.arch }}/usr/bin/
          fi

      - name: 📦 build pkgs
        working-directory: /home/builder/void-packages
        run: |
          pkgs=$(cat /tmp/templates)

          for pkg in $pkgs; do
            echo "🏗️ Building $pkg for $ARCH..."
            if [ "${{ matrix.config.arch }}" = "aarch64" ] || [ "${{ matrix.config.arch }}" = "aarch64-musl" ]; then
              sudo -Eu builder \
                XBPS_ALLOW_CHROOT_BREAKOUT=1 \
                XBPS_NO_UNSHARE=1 \
                XBPS_SRC_HOME=/home/builder/void-packages \
                bash /home/builder/void-packages/xbps-src \
                  -m masterdir-${{ matrix.config.arch }} \
                  -a ${{ matrix.config.arch }} \
                  pkg -j$(nproc) "$pkg" || printf "Failed building $pkg!\n"
            else
              sudo -Eu builder \
                XBPS_NO_UNSHARE=1 \
                XBPS_SRC_HOME=/home/builder/void-packages \
                bash /home/builder/void-packages/xbps-src \
                  -m masterdir-${{ matrix.config.arch }} \
                  -A ${{ matrix.config.arch }} \
                  pkg -j$(nproc) "$pkg" || printf "Failed building $pkg!\n"
            fi
          done

      - name: 🧾 Clean & sign
        working-directory: /home/builder/void-packages/hostdir/binpkgs
        env:
          PRIVKEY: ${{ secrets.PRIV_KEY }}
          XBPS_PASSPHRASE: ${{ secrets.SIGN_PASS }}
        run: |
          if [ ! -d "/home/builder/void-packages/hostdir/binpkgs" ]; then
            echo "❌ Directory /home/builder/void-packages/hostdir/binpkgs does not exist"
            exit 1
          fi

          count=$(ls *.xbps 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "❌ No .xbps packages found to sign. Build failed or no changes."
            exit 1
          fi

          sudo -Eu builder xbps-rindex --remove-obsoletes ${PWD}
          printf "%s\n" "${PRIVKEY}" > key.pem
          sudo -Eu builder xbps-rindex --privkey key.pem --sign --signedby "${REPO_NAME}-github-actions" --verbose ${PWD}
          sudo -Eu builder xbps-rindex --privkey key.pem --sign-pkg --verbose ${PWD}/*.xbps
          sudo -Eu builder rm -f key.pem
          sudo -Eu builder xbps-rindex --clean ${PWD}

      - name: 🔢 checksum
        working-directory: /home/builder/void-packages/hostdir/binpkgs
        run: |
          rm -rf *.sha256sum *.sha512sum
          count=$(ls -1 *.xbps 2>/dev/null | wc -l)
          if [ "$count" != 0 ]; then
            for file in *.xbps; do
              sha256sum "${file}" | cut -d ' ' -f 1 > "${file}.sha256sum"
              sha512sum "${file}" | cut -d ' ' -f 1 > "${file}.sha512sum"
            done
          else
            echo "❌ No packages found to checksum."
          fi

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.arch }}-repodata
          path: /home/builder/void-packages/hostdir/binpkgs

      - name: 🏷️ short sha
        run: |
          printf "SHORT_SHA=$(git rev-parse --short ${SHA})" >> $GITHUB_ENV

      - name: 🚀 release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.SHORT_SHA }}
          tag_name: ${{ env.TAG }}
          files: |
            /home/builder/void-packages/hostdir/binpkgs/*.xbps
            /home/builder/void-packages/hostdir/binpkgs/*.sig2
            /home/builder/void-packages/hostdir/binpkgs/*repodata
