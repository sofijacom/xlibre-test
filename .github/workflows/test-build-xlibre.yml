name: Build VOID Linux

env:
  TAG: workflow-${{ github.run_number }}
  SHA: ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - srcpkgs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 📦 ${{ matrix.config.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        config:
          # - { arch: x86_64,       host: x86_64,      libc: glibc, platform: linux/amd64, test: 1 }
          #- { arch: i686,         host: i686,        libc: glibc, platform: linux/386,   test: 1 }
          - { arch: aarch64,      host: x86_64,      libc: glibc, platform: linux/amd64, test: 0 }
          #- { arch: armv7l,       host: x86_64,      libc: glibc, platform: linux/amd64, test: 0 }
          # - { arch: x86_64-musl,  host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 1 }
          #- { arch: armv6l-musl,  host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 0 }
          - { arch: aarch64-musl, host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 0 }

    container:
      image: ghcr.io/void-linux/void-glibc-full:20250616R1
      options: --platform linux/amd64 --privileged
      volumes:
        - /dev:/dev
      env:
        SHELL: /bin/bash
        TAG: '${{ env.TAG }}'
        SHA: '${{ env.SHA }}'
        ARCH: '${{ matrix.config.arch }}'
        XBPS_TARGET_ARCH: '${{ matrix.config.arch }}'
        REPO_OWNER: "${{ github.repository_owner }}"
        REPO_NAME: "${{ github.event.repository.name }}"

    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      #- name: ⏳ Cache hostdir
      #  uses: actions/cache@v4
      #  with:
      #    path: ./hostdir
      #    key: ${{ runner.os }}-hostdir-${{ matrix.config.arch }}-${{ hashFiles('srcpkgs/**') }}
      #    restore-keys: |
      #      ${{ runner.os }}-hostdir-${{ matrix.config.arch }}-

      - name: 🛠️ Prepare container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          # sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf          
          env -u XBPS_TARGET_ARCH xbps-install -Syu xbps
          env -u XBPS_TARGET_ARCH xbps-install -yu
          env -u XBPS_TARGET_ARCH xbps-install -y sudo bash curl jq git xz zip unzip github-cli
          useradd -G xbuilder -M builder -s $(which bash)

      - name: 🔧 Setup cross-build environment
        run: |
          ARCH="${{ matrix.config.arch }}"
          echo "==> Target architecture: $ARCH"
          echo "✅ Cross-compilation will be handled by xbps-src directly — no 'cross-*' packages needed."
          
      - name: 🔁 Checkout void-packages
        uses: actions/checkout@v6
        with:
          repository: void-linux/void-packages
          ref: master

      - name: 🔄 Merge this repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "*"
          git remote add -f $REPO_OWNER https://github.com/$REPO_OWNER/$REPO_NAME.git
          git merge --no-commit --strategy-option=theirs --allow-unrelated-histories -Xignore-space-change $REPO_OWNER/main
          mkdir -p hostdir/binpkgs
          
          gh release download --pattern "*${ARCH}*" --dir hostdir/binpkgs --repo $REPO_OWNER/$REPO_NAME || true

          # Clean conflicting archs
          case "$ARCH" in
            x86_64)       rm -f hostdir/binpkgs/*x86_64-musl*.xbps ;;
            x86_64-musl)  rm -f hostdir/binpkgs/*x86_64*.xbps ;;
            aarch64)      rm -f hostdir/binpkgs/*aarch64-musl*.xbps ;;
            aarch64-musl) rm -f hostdir/binpkgs/*aarch64*.xbps ;;
          esac
          rm -f hostdir/binpkgs/*.xbps.sig2

      - name: 🔍 Identify changed packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_name=$(gh release view --json tagName --jq '.tagName' --repo $REPO_OWNER/$REPO_NAME 2>/dev/null || echo "Initial Commit")
          latest_sha=$(git rev-list --max-count=1 ${latest_name} 2>/dev/null || git rev-list --max-parents=0 $REPO_OWNER/main)
          echo "Latest tag: ${latest_name}, SHA: ${latest_sha}"

          chown -R builder:builder .
          git diff-tree -r --no-renames --name-only --diff-filter=AM ${latest_sha} ${SHA} -- 'srcpkgs/**' \
            | cut -d/ -f 2 | uniq | xargs sudo -Eu builder ./xbps-src sort-dependencies | tee /tmp/templates

      - name: ⚙️ Setup build environment
        run: |
          chown -R builder:builder .
          echo XBPS_BUILD_ENVIRONMENT=void-packages-ci >> etc/conf
          echo XBPS_ALLOW_RESTRICTED=yes >> etc/conf
          echo XBPS_CHROOT_CMD=uchroot >> etc/conf

      - name: 🏗️ Build packages
        run: |
          #!/bin/bash
          chown -R builder:builder .
          pkgs=$(cat /tmp/templates)
          for pkg in ${pkgs}; do
            echo "🏗️ Building $pkg for $ARCH..."
            if [[ "${{ matrix.config.host }}" == "${{ matrix.config.arch }}" ]]; then
              yes | sudo -Eu builder ./xbps-src -A ${{ matrix.config.host }} binary-bootstrap
              sudo -Eu builder ./xbps-src -j$(nproc) pkg "${pkg}" || echo "❌ Failed: ${pkg}"
            else
              yes | sudo -Eu builder ./xbps-src -a ${{ matrix.config.arch }} -A ${{ matrix.config.host }} binary-bootstrap
              sudo -Eu builder ./xbps-src -j$(nproc) pkg -a ${{ matrix.config.arch }} -A ${{ matrix.config.host }} "${pkg}" || echo "❌ Failed: ${pkg}"
            fi
          done

      - name: 🧹 Clean & sign
        working-directory: ./hostdir/binpkgs
        env:
          PRIVKEY: ${{ secrets.PRIV_KEY }}
          XBPS_PASSPHRASE: ${{ secrets.SIGN_PASS }}
        run: |
          if ls *.xbps 1>/dev/null 2>&1; then
            sudo -Eu builder xbps-rindex --remove-obsoletes ${PWD}
            if [ -n "${PRIVKEY}" ]; then
              printf "%s\n" "${PRIVKEY}" > key.pem
              sudo -Eu builder xbps-rindex --privkey key.pem --sign --signedby "${REPO_NAME}-github-actions" --verbose ${PWD}
              sudo -Eu builder xbps-rindex --privkey key.pem --sign-pkg --verbose ${PWD}/*.xbps
              sudo -Eu builder rm -f key.pem
            else
              echo "⚠️ No PRIV_KEY — skipping signing (fork mode)."
            fi
            sudo -Eu builder xbps-rindex --clean ${PWD}
          else
            echo "❌ No packages built — skipping rindex."
            exit 0
          fi

      - name: 🔢 Generate checksums
        working-directory: ./hostdir/binpkgs
        id: checksum
        run: |
          rm -f *.sha256sum *.sha512sum
          count=$(ls *.xbps 2>/dev/null | wc -l || echo 0)
          echo "count=$count" >> $GITHUB_OUTPUT
          if [ "$count" -gt 0 ]; then
            for file in *.xbps; do
              sha256sum "$file" | cut -d' ' -f1 > "$file.sha256sum"
              sha512sum "$file" | cut -d' ' -f1 > "$file.sha512sum"
            done
          else
            echo "No packages to checksum."
          fi

      - name: 📦 Upload Artifact
        if: steps.checksum.outputs.count > 0
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.arch }}-repodata
          path: ./hostdir/binpkgs

      - name: 🔖 Set short SHA
        run: |
          printf "SHORT_SHA=$(git rev-parse --short ${SHA})" >> $GITHUB_ENV

      - name: 🚀 Create Release
        if: steps.checksum.outputs.count > 0 && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.SHORT_SHA }}
          tag_name: ${{ env.TAG }}
          files: |
            ./hostdir/binpkgs/*.xbps
            ./hostdir/binpkgs/*.sig2
            ./hostdir/binpkgs/*repodata
          draft: false
          prerelease: false
