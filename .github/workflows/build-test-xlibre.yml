name: 🏗️ Build XLibre Packages (xbps)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - srcpkgs/xlibre/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 📦 ${{ matrix.config.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Обязательно для загрузки в Releases
    strategy:
      fail-fast: false
      matrix:
        config:
          - { arch: aarch64, host: aarch64, libc: glibc, platform: linux/arm64 }
          - { arch: aarch64-musl, host: aarch64-musl, libc: musl, platform: linux/arm64 }

    container:
      image: ghcr.io/void-linux/void-${{ matrix.config.libc }}-full:20250616R1
      options: --platform ${{ matrix.config.platform }} --privileged
      volumes:
        - /dev:/dev
      env:
        ARCH: ${{ matrix.config.arch }}
        XBPS_TARGET_ARCH: ${{ matrix.config.arch }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}

    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      # --- Подготовка контейнера ---
      - name: 🧰 Prep container and create user
        run: |
          set -e
          
          echo "🔌 Setting up XBPS repositories..."
          mkdir -p /etc/xbps.d
          cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/ || true

          echo "⚡ Updating core package manager..."
          env -u XBPS_TARGET_ARCH xbps-install -Syu xbps || exit 1
          
          echo "🔄 Full system upgrade inside runner..."
          env -u XBPS_TARGET_ARCH xbps-install -yu || exit 1

          echo "📦 Installing build tools and gh cli..."
          env -u XBPS_TARGET_ARCH xbps-install -y sudo bash curl grep jq zip unzip git xtools gh coreutils shadow || exit 1
          
          # Безопасное создание группы и пользователя
          if ! getent group xbuilder > /dev/null 2>&1; then
            echo "👥 Creating group 'xbuilder'..."
            groupadd --gid 1001 xbuilder
          fi

          if ! id builder > /dev/null 2>&1; then
            echo "👤 Creating user 'builder'..."
            useradd --create-home --shell $(which bash) --groups xbuilder builder
            chown -R builder:builder /home/builder
          else
            echo "ℹ️ User 'builder' already exists."
          fi

      # --- Клонирование void-packages и слияние шаблонов ---
      - name: 🔎 Checkout void-packages
        uses: actions/checkout@v6
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages

      - name: 🐛 Fix sourcepkg.sh (musl compatibility)
        working-directory: void-packages
        run: sed -i "s@for var in \$(awk .*;@for var in \$(printenv | cut -d'=' -f1);@" common/environment/setup/sourcepkg.sh

      - name: 🧩 Merge this repository into void-packages
        working-directory: void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add custom "https://github.com/$REPO_OWNER/$REPO_NAME.git"
          git fetch custom
          git merge --no-commit --strategy-option=theirs --allow-unrelated-histories -Xignore-space-change custom/main
          mkdir -p hostdir/binpkgs
          
          # Сохраняем старые пакеты от предыдущих запусков
          gh release download --pattern "*${ARCH}*" --dir hostdir/binpkgs --repo $REPO_OWNER/$REPO_NAME || true
          
          # Чистим конфликтующие архитектуры из артефактов
          rm -f hostdir/binpkgs/*$ARCH-musl*.xbps 2>/dev/null || true
          rm -f hostdir/binpkgs/*$ARCH-glibc*.xbps 2>/dev/null || true
          rm -f hostdir/binpkgs/*.sig2 2>/dev/null || true

      # --- Определение пакетов на сборку ---
      - name: 📋 Identify changes to build
        working-directory: void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          latest_tag=$(gh release view --json tagName --jq '.tagName' || echo "")
          if [ -n "$latest_tag" ]; then
            latest_sha=$(git rev-list -1 "$latest_tag")
          else
            latest_sha=$(git rev-list --max-parents=0 HEAD)
          fi
          
          echo "🕵️ Comparing against: $latest_tag ($latest_sha)"
          
          chown -R builder:builder .
          git diff-tree -r --no-renames --name-only --diff-filter=AM ${latest_sha} ${SHA} -- 'srcpkgs/xlibre/**' \
          | cut -d/ -f 2 | uniq | sort -u | tee /tmp/templates

      - name: 🧹 Clean outdated .xbps for changed packages
        working-directory: void-packages
        run: |
          pkgs=$(cat /tmp/templates)
          if [ -z "$pkgs" ]; then echo "✅ No template changes detected."; exit 0; fi
          
          echo "📋 Packages to rebuild:"
          cat /tmp/templates
          
          for pkg in $pkgs; do
            echo "🧹 Deleting old artifacts for $pkg..."
            find hostdir/binpkgs -name "${pkg}-*.xbps" -exec rm -fv {} + || true
            find hostdir/binpkgs -name "${pkg}-*.sig2" -exec rm -fv {} + || true
          done

      # --- Настройка окружения сборки ---
      - name: 🛠️ Setup void-packages conf
        working-directory: void-packages
        run: |
          chown -R builder:builder .
          mkdir -p etc
          echo XBPS_BUILD_ENVIRONMENT=void-packages-ci >> etc/conf
          echo XBPS_ALLOW_RESTRICTED=yes >> etc/conf
          echo XBPS_CHROOT_CMD=uchroot >> etc/conf
          echo 'XBPS_REPOSITORY=$PWD/hostdir/binpkgs' >> etc/conf
          echo 'XBPS_DISTDIR=$PWD/hostdir/distfiles' >> etc/conf

      - name: 🔧 Prepare masterdir (bootstrap)
        working-directory: void-packages
        env:
          ARCH: ${{ matrix.config.arch }}
        run: |
          yes | sudo -Eu builder ./xbps-src -m masterdir-${ARCH} -A ${ARCH} binary-bootstrap

      - name: ✅ Install base-devtools in chroot
        working-directory: void-packages
        env:
          ARCH: ${{ matrix.config.arch }}
        run: |
          MASTER="masterdir-${ARCH}"
          mount --bind /proc "$MASTER/proc"
          mount --bind /dev "$MASTER/dev"
          mount --bind /sys "$MASTER/sys"
          chroot "$MASTER" xbps-install -y base-devel meson ninja python3 gettext-devel libxcvt-devel libdrm-devel eudev-libudev-devel
          umount "$MASTER/proc" "$MASTER/dev" "$MASTER/sys"

      - name: 🗑️ Reset package cache & sync repos
        working-directory: void-packages
        run: sudo -Eu builder ./xbps-src clean || true

      # --- Сборка пакета xlibre ---
      - name: 📦 Build pkgs
        working-directory: void-packages
        env:
          ARCH: ${{ matrix.config.arch }}
        run: |
          pkgs=$(cat /tmp/templates)
          if [ -z "$pkgs" ]; then echo "Nothing to build"; exit 0; fi
          
          for pkg in $pkgs; do
            echo "🏗️ Building $pkg for $ARCH..."
            timeout 3h sudo -Eu builder ./xbps-src -f pkg -j$(nproc) -m masterdir-${ARCH} -A ${ARCH} "${pkg}" || echo "⚠️ Failed building ${pkg}, continuing..."
          done
          
      - name: 📊 Report what was built
        working-directory: void-packages/hostdir/binpkgs
        run: |
          ls -1 *.xbps 2>/dev/null || echo "No new binaries."

      # --- Индексация и подпись репозитория ---
      - name: 📦 Sign & Index repo
        working-directory: void-packages/hostdir/binpkgs
        env:
          PRIV_KEY: ${{ secrets.PRIV_KEY }}
          ARCH: ${{ matrix.config.arch }}
        run: |
          set -e
          export PATH="/opt/xbps/usr/bin/:$PATH"
          rm -f repodata* index.* *.plist sha256sums* sha512sums*
          
          count=$(ls -1 *.xbps 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "⚠️ No .xbps files found after build step."
            exit 0
          fi

          echo "✅ Found $count packages. Generating indexes..."
          xbps-rindex -a *.xbps

          if [ -n "$PRIV_KEY" ]; then
            printf "%s\n" "$PRIV_KEY" > private.pem
            chmod 600 private.pem
            
            xbps-rindex -r "$PWD"
            xbps-rindex -s --signedby "Void CI Bot <ci@example.com>" --privkey private.pem "$PWD"
            xbps-rindex -S --privkey private.pem "$PWD"/*.xbps
            xbps-rindex -c "$PWD"
            
            rm -f private.pem
          else
            echo "⚠️ No PRIV_KEY secret provided — skipping signing."
          fi

      - name: ⬇️ Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.arch }}-binpkgs
          path: void-packages/hostdir/binpkgs
          retention-days: 7

      # --- Загрузка в GitHub Releases ---
      - name: 📤 Create Release & Upload Assets
        if: success() && github.ref == 'refs/heads/main'
        working-directory: void-packages/hostdir/binpkgs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.config.arch }}
        run: |
          set -euo pipefail
          TAG="${ARCH}-latest"
          NAME="XLibre Repository for $ARCH"
          
          API="https://api.github.com/repos/${{ github.repository }}"
          AUTH="Authorization: Bearer $GH_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"

          EXISTING=$(curl -s -H "$AUTH" -H "$ACCEPT" "$API/releases/tags/$TAG" || echo "{}")
          ID=$(echo "$EXISTING" | jq -r '.id')
          if [ "$ID" != "null" ]; then
            echo "🗑️ Removing old release $TAG (ID: $ID)..."
            curl -s -X DELETE -H "$AUTH" -H "$ACCEPT" "$API/releases/$ID" > /dev/null
          fi

          BODY=$(jq -nc --arg t "$TAG" --arg n "$NAME" '{tag_name:$t, name:$n, draft:false, prerelease:false}')
          NEW=$(curl -s -X POST -H "$AUTH" -H "$ACCEPT" -H "Content-Type: application/json" -d "$BODY" "$API/releases")
          REL_ID=$(echo "$NEW" | jq -r '.id')

          for file in *.xbps *.sig2 *-repodata; do
            if [ -f "$file" ]; then
              echo "📤 Uploading $file..."
              curl -s --fail -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
                --data-binary "@$file" \
                "$API/releases/$REL_ID/assets?name=$file"
            fi
          done
