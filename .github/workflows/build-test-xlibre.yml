name: Test XLibre

env:
  TAG: workflow-${{ github.run_number }}
  SHA: ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - srcpkgs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 📦 ${{ matrix.config.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        config:
          #- { arch: x86_64,       host: x86_64,      libc: glibc, platform: linux/amd64, test: 1 }
          #- { arch: i686,         host: i686,        libc: glibc, platform: linux/386,   test: 1 }
          - { arch: aarch64,      host: x86_64,      libc: glibc, platform: linux/amd64, test: 0 }
          #- { arch: armv7l,       host: x86_64,      libc: glibc, platform: linux/amd64, test: 0 }
          #- { arch: x86_64-musl,  host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 1 }
          #- { arch: armv6l-musl,  host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 0 }
          - { arch: aarch64-musl, host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 0 }
  
    container:
      image: ghcr.io/void-linux/void-glibc-full
      options: --platform linux/amd64 --privileged
      volumes:
        - /dev:/dev
      env:
        TAG: '${{ env.TAG }}'
        SHA: '${{ env.SHA }}'
        ARCH: '${{ matrix.config.arch }}'
        HOST: '${{ matrix.config.host }}'
        XBPS_TARGET_ARCH: '${{ matrix.config.arch }}'
        REPO_OWNER: "${{ github.repository_owner }}"
        REPO_NAME: "${{ github.event.repository.name }}"
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Prepare container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          env -u XBPS_TARGET_ARCH xbps-install -Syu xbps
          env -u XBPS_TARGET_ARCH xbps-install -yu
          env -u XBPS_TARGET_ARCH xbps-install -y sudo bash curl grep jq git xz zip unzip github-cli xtools coreutils binfmt-support qemu-user-static
          update-binfmts --enable
          useradd -G xbuilder -M builder -s $(which bash)
            
      - name: Checkout xlibre
        uses: actions/checkout@v6
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages

      # --- НАЧАЛО НОВОГО ШАГА КЭШИРОВАНИЯ ---
      - name: Cache void-packages directories
        uses: actions/cache@v6.1.0
        id: cache-restore
        with:
          path: |
            void-packages/masterdir
            void-packages/hostdir/distfiles
          key: void-cache-${{ matrix.config.arch }}-${{ matrix.config.host }}-{{ hashFiles('srcpkgs/**/template') }}
          restore-keys: |
            void-cache-${{ matrix.config.arch }}-${{ matrix.config.host }}-
      # --- КОНЕЦ НОВОГО ШАГА ---

      - name: 🐛 Fix sourcepkg.sh — replace awk with shell parameter expansion
        working-directory: void-packages
        run: |
          sed -i "s@for var in \$(awk .*;@for var in \$(printenv | cut -d'=' -f1);@" common/environment/setup/sourcepkg.sh
          
      - name: Merge this repository into void-linux/void-packages
        working-directory: void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "*"
          git remote add -f $REPO_OWNER https://github.com/$REPO_OWNER/$REPO_NAME.git
          git merge --no-commit --strategy-option=theirs --allow-unrelated-histories -Xignore-space-change $REPO_OWNER/main
          mkdir -p hostdir/binpkgs
          
          gh release download --pattern "*${ARCH}*" --dir hostdir/binpkgs --repo $REPO_OWNER/$REPO_NAME || true
          
          # Clean up mismatched architectures so repodata generates correctly
          if [ "$ARCH" = "x86_64" ]; then
            rm --force hostdir/binpkgs/*x86_64-musl*.xbps
          elif [ "$ARCH" = "x86_64-musl" ]; then
            rm --force hostdir/binpkgs/*x86_64*.xbps
          elif [ "$ARCH" = "aarch64" ]; then
            rm --force hostdir/binpkgs/*aarch64-musl*.xbps
          elif [ "$ARCH" = "aarch64-musl" ]; then
            rm --force hostdir/binpkgs/*aarch64*.xbps
          fi
          # Remove all signature files to avoid conflicts
          rm --force hostdir/binpkgs/*.xbps.sig2

      - name: Identify changes to build
        working-directory: void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Identifying changed packages..."
          
          # Обновляем данные о remote-ветках. Это критично для detached HEAD в CI.
          git fetch origin main --depth=1000 || true
          
          chown -R builder:builder srcpkgs hostdir etc .git || true
          
          latest_name=$(gh release view --json tagName --jq '.tagName' --repo $REPO_OWNER/$REPO_NAME 2>/dev/null || echo "")
          
          if [ -z "$latest_name" ]; then
            echo "No releases found. Comparing against the initial commit of main."
            
            # Проверяем, есть ли у текущего SHA родители
            PARENTS=$(git rev-list --parents -n 1 "${SHA}" | wc -w)
            
            if [ "$PARENTS" -gt 1 ]; then
              # Если родитель есть, сравниваем с корнем ветки main
              latest_sha=$(git rev-list --max-parents=0 origin/main)
            else
              # Если это самый первый коммит в репозитории (root commit),
              # используем пустой хеш, чтобы diff-tree выдал все файлы.
              latest_sha=$(git hash-object --stdin </dev/null)
            fi
          else
            echo "Found release: $latest_name"
            latest_sha=$(git rev-list --max-count=1 "$latest_name")
          fi
          
          echo "Comparing range: $latest_sha ... $SHA"
          
          CHANGED_PKGS=$(git diff-tree -r --no-renames --name-only --diff-filter=AM ${latest_sha} ${SHA} -- 'srcpkgs/**' \
            | cut -d/ -f 2 | sort -u)
            
          if [ -z "$CHANGED_PKGS" ]; then
            echo "✅ No template files changed in this commit."
            exit 0
          fi
          
          echo "$CHANGED_PKGS" > /tmp/templates
          echo "Templates to build:"
          cat /tmp/templates
          
      - name: Setup void-packages
        working-directory: void-packages
        run: |
          chown -R builder:builder srcpkgs hostdir etc
          mkdir -p etc
          # Фиксируем оболочку ПЕРВЫМ делом
          echo XBPS_SHELL=/bin/bash > etc/conf
          echo XBPS_BUILD_ENVIRONMENT=void-packages-ci >> etc/conf
          echo XBPS_ALLOW_RESTRICTED=yes >> etc/conf
          echo XBPS_CHROOT_CMD=uchroot >> etc/conf
          echo 'XBPS_REPOSITORY=$PWD/hostdir/binpkgs' >> etc/conf
          echo 'XBPS_DISTDIR=$PWD/hostdir/distfiles' >> etc/conf
          echo 'XBPS_MASTERDIR_PKGS="$PWD/hostdir/binpkgs"' >> etc/conf

      - name: Setup emulation and bootstrap masterdir
        working-directory: void-packages
        env:
          ARCH: ${{ matrix.config.arch }}
          HOST: ${{ matrix.config.host }}
        run: |
          set +e
          if [ -z "$BASH_VERSION" ]; then
            exec /bin/bash -e "$0" "$@"
          fi
          
          echo "🐧 Bootstrapping masterdir for $ARCH using host $HOST..."
          
          # 1. Создаем папку мастера РАНЬШЕ xbps-src. 
          # Используем root (мы уже в нем) и полный путь $PWD.
          MASTERDIR_PATH="$PWD/masterdir-$HOST"
          
          echo "📁 Creating directory: $MASTERDIR_PATH"
          rm -rf "$MASTERDIR_PATH" || true
          mkdir -p "$MASTERDIR_PATH"
          
          # 2. Даем права билдеру на УЖЕ созданную папку
          chown -R builder:builder "$MASTERDIR_PATH"
          
          # 3. Экспортируем переменные окружения принудительно
          export XBPS_MASTERDIR="$MASTERDIR_PATH"
          export XBPS_DISTDIR="$PWD/hostdir/distfiles"
          export XBPS_REPOSITORY="$PWD/hostdir/binpkgs"
          
          # Включаем эмуляцию binfmt_misc (критично для aarch64 на x86_64)
          sudo update-binfmts --enable > /dev/null 2>&1 || true
          
          # 4. Запускаем бутстрап. Теперь он НЕ будет пытаться создавать папку,
          # он найдет её существующей и начнет распаковку base-system внутрь.
          if [[ "$HOST" == "$ARCH" ]]; then
            yes | sudo -Eu builder ./xbps-src -A "$HOST" binary-bootstrap
          else
            yes | sudo -Eu builder ./xbps-src -a "$ARCH" -A "$HOST" binary-bootstrap
          fi
           
      - name: build pkgs
        working-directory: void-packages
        env:
          ARCH: ${{ matrix.config.arch }}
          HOST: ${{ matrix.config.host }}
        run: |
          chown -R builder:builder srcpkgs hostdir etc
          pkgs=$(cat /tmp/templates)
    
          echo "📦 Starting build loop for packages in this commit..."
      
          for pkg in $pkgs; do
            echo "🏗️ Building $pkg for $ARCH..."
            
            if [[ "${{ matrix.config.host }}" == "${{ matrix.config.arch }}" ]]; then
              sudo -Eu builder ./xbps-src pkg -j$(nproc) -A "${{ matrix.config.host }}" "$pkg" || printf "Failed building %s!\n" "$pkg"
            else
              sudo -Eu builder ./xbps-src pkg -j$(nproc) -a "${{ matrix.config.arch }}" -A "${{ matrix.config.host }}" "$pkg" || printf "❌ Failed building: %s!\n" "$pkg"
            fi
          done
          
      - name: Clean & sign
        working-directory: void-packages/hostdir/binpkgs
        env:
          PRIVKEY: ${{ secrets.PRIV_KEY }}
          XBPS_PASSPHRASE: ${{ secrets.SIGN_PASS }}
          TARGET_ARCH: ${{ matrix.config.arch }}
        run: |
          echo "🧹 Preparing directory for $TARGET_ARCH..."
          
          # Удаляем ТОЛЬКО свой файл реподаты перед началом, 
          # чтобы избежать дублирования или конфликтов со старыми данными
          rm -f "${TARGET_ARCH}-repodata" *.sig2 || true

          # Проверяем наличие собранных пакетов
          if compgen -G "*.xbps" > /dev/null; then
            echo "📦 Found packages for $TARGET_ARCH, running indexer with strict path filter..."
            
            # Очистка от старых версий того же пакета внутри текущего арха
            sudo -Eu builder xbps-rindex --remove-obsoletes .
            
            # Генерация метаданных строго по текущему каталогу
            sudo -Eu builder xbps-rindex --repolist . --sign --signedby "${REPO_NAME}-github-actions" --verbose .
            
            # Подписываем сами бинарные пакеты (.xbps)
            if [ -n "${PRIVKEY}" ]; then
              printf "%s\n" "${PRIVKEY}" > key.pem
              sudo -Eu builder xbps-rindex --privkey key.pem --sign-pkg --verbose *.xbps
              rm -f key.pem
            else
              echo "No PRIV_KEY found. Skipping cryptographic signing."
            fi
            
            # Финальная очистка мусора (старые записи о версиях)
            sudo -Eu builder xbps-rindex --clean .
            
            # Дополнительная страховка на случай багов старой версии xbps-rindex
            # Если он всё же создал лишнюю repodata помимо нашей, удалим её
            rm -f *-repodata || true
            # Но убедимся, что наш целевой файл остался на месте (если были пакеты)
            ls -la "${TARGET_ARCH}-repodata" 2>/dev/null || echo "Warning: Target repodata not found after indexing!"

          else
            echo "❌ No packages were built for $TARGET_ARCH. Skipping indexing and cleaning up signatures."
            # Если пакетов нет, оставляем папку абсолютно чистой от служебных файлов
            rm -f *-repodata *.sig2 || true
          fi
          
      - name: checksum
        working-directory: void-packages/hostdir/binpkgs
        run: |
          rm -rf *.sha256sum *.sha512sum
          
          count=$(ls -1 *.xbps 2>/dev/null | wc -l)
          if [ "$count" != 0 ]; then
            for file in *.xbps; do
              sha256sum "${file}" | cut -d ' ' -f 1 > "${file}.sha256sum"
              sha512sum "${file}" | cut -d ' ' -f 1 > "${file}.sha512sum"
            done
          else
            echo "No packages found to checksum."
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.arch }}-repodata
          path: void-packages/hostdir/binpkgs

      - name: short sha
        run: |
          printf "SHORT_SHA=$(git rev-parse --short ${SHA})" >> $GITHUB_ENV

      - name: Save cache (Save step is automatic, but we ensure distfiles are saved too)
        uses: actions/cache@v4
        with:
          path: |
            void-packages/masterdir
            void-packages/hostdir/distfiles
          key: ${{ steps.cache-restore.outputs.key }}
        
      - name: release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.SHORT_SHA }}
          tag_name: ${{ env.TAG }}
          files: |
            void-packages/hostdir/binpkgs/*.xbps
            void-packages/hostdir/binpkgs/*.sig2
            void-packages/hostdir/binpkgs/*repodata
