name: Test XLibre VOID linux

env:
  TAG: workflow-${{ github.run_number }}
  SHA: ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - srcpkgs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 📦 ${{ matrix.config.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        config:
          - { arch: x86_64,       host: x86_64,      libc: glibc, platform: linux/amd64, test: 1 }
          - { arch: aarch64,      host: x86_64,      libc: glibc, platform: linux/amd64, test: 0 }
          - { arch: aarch64-musl, host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 0 }

    steps:
      # --- ШАГ 1: Авторизация в GHCR и подготовка ---
      - name: Setup Docker and Permissions
        run: |
          echo "🔧 Preparing environment..."
          
          # Вход в реестр GitHub Container Registry (обязательно для pull)
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          sudo chown -R runner:docker .
      
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Merge fork into void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add myfork https://github.com/"$REPO_OWNER"/"$REPO_NAME".git || true
          git fetch myfork main --depth=100
          git merge --no-commit --strategy-recursive -Xtheirs myfork/main || true
          
          mkdir -p hostdir/binpkgs
          rm -f hostdir/binpkgs/*.xbps.sig2
          
          cd hostdir/binpkgs || exit 1
          for f in *-"$ARCH"*; do
            [ -e "$f" ] || continue
            case "$ARCH" in
              x86_64) echo "$f" | grep -q -- '-musl\.' && rm -f -- "$f" ;;
              aarch64) echo "$f" | grep -q -- '-musl\.' && rm -f -- "$f" ;;
            esac
          done
          cd - > /dev/null || exit 1

      - name: Identify changes to build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_HEAD=$(git rev-parse HEAD)
          latest_name=$(gh release view --json tagName --jq '.tagName' --repo "$REPO_OWNER/$REPO_NAME" 2>/dev/null || echo "")
          
          if [ -n "$latest_name" ]; then
            base_sha=$(git rev-list -n 1 "$latest_name")
          else
            base_sha=$(git rev-list --max-parents=0 myfork/main)
          fi
          
          echo "🔍 Comparing $base_sha -> $CURRENT_HEAD"
          ls -la srcpkgs/
          
          changed=$(git diff-tree --no-commit-id --name-only -r "$base_sha".."$CURRENT_HEAD" -- 'srcpkgs/')
          
          if [ -n "$changed" ]; then
            echo "$changed" | cut -d/ -f 2 | sort -u | ./xbps-src sort-dependencies | tee /tmp/templates
          else
            echo "⚠️ No package templates found in the diff."
            touch /tmp/templates
          fi

      # --- ШАГ 2: Запуск ОФИЦИАЛЬНОГО контейнера напрямую ---
      - name: Build packages inside official container
        id: build
        run: |
          echo "🐳 Starting official Void Linux builder container..."
          
          # Создаем пользователя внутри образа (если его нет)
          docker run --rm \
            -v $(pwd):/void-packages \
            -w /void-packages \
            -e ARCH="${{ matrix.config.arch }}" \
            -e HOST="${{ matrix.config.host }}" \
            -e GITHUB_RUN_NUMBER="${{ github.run_number }}" \
            -e GITHUB_SHA="${{ github.sha }}" \
            -e REPO_OWNER="${{ github.repository_owner }}" \
            -e REPO_NAME="${{ github.event.repository.name }}" \
            --platform linux/amd64 \
            --privileged \
            ghcr.io/void-linux/void-glibc-full:current \
            bash -c '
              set -e
              
              # Подготовка окружения ВНУТРИ контейнера
              useradd -G xbuilder -M builder -s /bin/bash || true
              mkdir -p /home/builder
              chown -R builder:builder /home/builder
              
              export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
              export XBPS_CHROOT_CMD=uchroot
              export XBPS_USE_MOUNTFS=no
              export XBPS_REPOSITORY="https://repo-default.voidlinux.org/current"
              export XBPS_TARGET_ARCH="$ARCH"
              
              # Копируем конфиг master ветки
              cp etc/defaults/master.conf etc/defaults.conf
              
              # Инициализация тулчейна
              if [ "$HOST" != "$ARCH" ]; then
                echo "🚜 Bootstrapping CROSS toolchain for $ARCH..."
                yes | su -s /bin/sh builder -c "./xbps-src -a \"$ARCH\" -A \"$HOST\" binary-bootstrap"
              else
                echo "🖥️ Bootstrapping NATIVE toolchain for $ARCH..."
                yes | su -s /bin/sh builder -c "./xbps-src -A \"$HOST\" binary-bootstrap"
              fi
              
              # Сборка
              if [ ! -s /tmp/templates ]; then
                echo "No templates file provided from previous step. Exiting gracefully."
                exit 0
              fi
              
              pkgs=""
              while IFS= read -r line; do
                pkgs="$pkgs $line"
              done < /tmp/templates
              
              SUCCESS_COUNT=0
              TOTAL_COUNT=0
              
              for pkg in $pkgs; do
                TOTAL_COUNT=$((TOTAL_COUNT + 1))
                CMD="./xbps-src -f pkg -j$(nproc) -A \"$HOST\" \"$pkg\""
                
                if [ "$HOST" != "$ARCH" ]; then
                  CMD="./xbps-src -f pkg -j$(nproc) -a \"$ARCH\" -A \"$HOST\" \"$pkg\""
                fi
                
                echo "🏗️ Building: $pkg"
                if su -s /bin/sh builder -c "$CMD"; then
                  echo "✅ Success: $pkg"
                  SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
                else
                  echo "❌ CRITICAL FAILURE building: $pkg"
                  exit 1
                fi
              done
              
              echo "build-success-count=$SUCCESS_COUNT" >> $GITHUB_OUTPUT
              echo "SHORT_SHA=$(git rev-parse --short \"$GITHUB_SHA\")" >> $GITHUB_OUTPUT
            '

      - name: Check build status
        if: steps.build.outputs.build-success-count == '0'
        run: |
          echo "No packages were built successfully."
          exit 1

      - name: Clean & sign
        working-directory: ./hostdir/binpkgs
        env:
          PRIVKEY: ${{ secrets.PRIV_KEY }}
          XBPS_PASSPHRASE: ${{ secrets.SIGN_PASS }}
        run: |
          echo "🐳 Running signing via temporary container..."
          
          docker run --rm \
            -v $(pwd):/work \
            -w /work \
            -e PRIVKEY="${{ secrets.PRIV_KEY }}" \
            -e XBPS_PASSPHRASE="${{ secrets.SIGN_PASS }}" \
            -e REPO_NAME="${{ github.event.repository.name }}" \
            --platform linux/amd64 \
            ghcr.io/void-linux/void-glibc-full:current \
            bash -c '
              set -e
              if [ ! -f "*.xbps" ] 2>/dev/null; then echo "No files."; exit 0; fi
              
              useradd -G xbuilder -M builder -s /bin/bash || true
              export PATH="/usr/local/bin:$PATH"
              
              su -s /bin/sh builder -c "xbps-rindex --remove-obsoletes \".\""
              
              if [ -n "$PRIVKEY" ]; then
                printf "%s\n" "$PRIVKEY" > key.pem
                su -s /bin/sh builder -c "xbps-rindex --privkey key.pem --sign --signedby \"${REPO_NAME}-github-actions\" --verbose \".\""
                su -s /bin/sh builder -c "xbps-rindex --privkey key.pem --sign-pkg --verbose ./*.xbps"
                rm -f key.pem
              fi
              
              su -s /bin/sh builder -c "xbps-rindex --clean \".\""
            '

      - name: Generate checksums
        working-directory: ./hostdir/binpkgs
        run: |
          find . -type f $ -iname "*.sha256sum" -o -iname "*.sha512sum" $ -delete
          for file in *.xbps; do
            [ -e "$file" ] || break
            sha256sum "$file" | awk '{print $1}' > "${file}.sha256sum"
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.arch }}-repodata
          path: ./hostdir/binpkgs

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.SHORT_SHA }}
          tag_name: ${{ env.TAG }}
          files: |
            ./hostdir/binpkgs/*.xbps
            ./hostdir/binpkgs/*.sig2
            ./hostdir/binpkgs/*repodata
