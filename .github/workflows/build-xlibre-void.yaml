name: Test XLibre VOID linux

env:
  TAG: workflow-${{ github.run_number }}
  SHA: ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - srcpkgs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 📦 ${{ matrix.config.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        config:
          - { arch: x86_64,       host: x86_64,      libc: glibc, platform: linux/amd64, test: 1 }
          #- { arch: i686,         host: i686,        libc: glibc, platform: linux/386,   test: 1 }
          - { arch: aarch64,      host: x86_64,      libc: glibc, platform: linux/amd64, test: 0 }
          #- { arch: armv7l,       host: x86_64,      libc: glibc, platform: linux/amd64, test: 0 }
          - { arch: x86_64-musl,  host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 1 }
          #- { arch: armv6l-musl,  host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 0 }
          - { arch: aarch64-musl, host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 0 }

    container:
      image: ghcr.io/void-linux/void-glibc-full
      options: --platform linux/amd64 --privileged
      volumes:
        - /dev:/dev
      env:
        TAG: '${{ env.TAG }}'
        SHA: '${{ env.SHA }}'
        ARCH: '${{ matrix.config.arch }}'
        XBPS_TARGET_ARCH: '${{ matrix.config.arch }}'
        REPO_OWNER: "${{ github.repository_owner }}"
        REPO_NAME: "${{ github.event.repository.name }}"
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Prepare container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          env -u XBPS_TARGET_ARCH xbps-install -Syu xbps
          env -u XBPS_TARGET_ARCH xbps-install -yu
          env -u XBPS_TARGET_ARCH xbps-install -y sudo bash curl grep jq git xz zip unzip github-cli xtools
          useradd -G xbuilder -M builder -s $(which bash)

      - name: Checkout xlibre
        uses: actions/checkout@v6
        with:
          repository: void-linux/void-packages
          ref: master

      - name: Merge this repository into void-linux/void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash          
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "*"
          git remote add -f $REPO_OWNER https://github.com/$REPO_OWNER/$REPO_NAME.git
          git merge --no-commit --strategy-option=theirs --allow-unrelated-histories -Xignore-space-change $REPO_OWNER/main
          mkdir -p hostdir/binpkgs

          # Download pre-built binaries from previous release to use as cache
          if gh release view "$TAG" --repo $REPO_OWNER/$REPO_NAME &>/dev/null; then
            gh release download "$TAG" --pattern "*${ARCH}*" --dir hostdir/binpkgs --repo $REPO_OWNER/$REPO_NAME || true
          fi

          # Clean up mismatched architectures so repodata generates correctly
          shopt -s nullglob
          for pattern in *x86_64-musl* *i686-musl* *armv*-musl* *aarch64-musl* \
                         *x86_64* *i686* *armv* *aarch64*; do
            case "$ARCH" in
              x86_64) [[ "$pattern" != *x86_64* ]] || [[ "$pattern" == *-musl* ]] && rm -f hostdir/binpkgs/$pattern ;;
              x86_64-musl) [[ "$pattern" != *x86_64-musl* ]] && rm -f hostdir/binpkgs/$pattern ;;
              aarch64) [[ "$pattern" != *aarch64* ]] || [[ "$pattern" == *-musl* ]] && rm -f hostdir/binpkgs/$pattern ;;
              aarch64-musl) [[ "$pattern" != *aarch64-musl* ]] && rm -f hostdir/binpkgs/$pattern ;;
            esac
          done
          shopt -u nullglob

          # Remove all signature files to avoid conflicts during index generation
          rm -f hostdir/binpkgs/*.xbps.sig2

      - name: Identify changes to build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_name=$(gh release view --json tagName --jq '.tagName' --repo $REPO_OWNER/$REPO_NAME || echo "Initial Commit")
          latest_sha=$(git rev-list --max-count=1 ${latest_name} 2>/dev/null || git rev-list --max-parents=0 $REPO_OWNER/main)
          echo "Latest Tag Name: ${latest_name}"
          echo "Latest Tag SHA: ${latest_sha}"

          chown -R builder:builder .

          git diff-tree -r --no-renames --name-only --diff-filter=AM ${latest_sha} ${SHA} -- 'srcpkgs/**' \
          | cut -d/ -f 2 | uniq | sudo -Eu builder ./xbps-src sort-dependencies | tee /tmp/templates

      - name: Setup void-packages and Toolchain
        run: |
          chown -R builder:builder .
          echo XBPS_BUILD_ENVIRONMENT=void-packages-ci >> etc/conf
          echo XBPS_ALLOW_RESTRICTED=yes >> etc/conf
          echo XBPS_CHROOT_CMD=uchroot >> etc/conf

          # Pre-download cross-compilation toolchains once per job to speed up the loop below
          if [[ "${{ matrix.config.host }}" != "${{ matrix.config.arch }}" ]]; then
            echo "🚜 Bootstrapping cross-toolchain for ${{ matrix.config.arch }}..."
            yes | sudo -Eu builder ./xbps-src -a ${{ matrix.config.arch }} -A ${{ matrix.config.host }} binary-bootstrap
          else
            echo "🖥️ Bootstrapping native toolchain for ${{ matrix.config.arch }}..."
            yes | sudo -Eu builder ./xbps-src -A ${{ matrix.config.host }} binary-bootstrap
          fi

      - name: Build pkgs
        run: |
          chown -R builder:builder .
          mapfile -t pkgs < /tmp/templates
          echo "Found packages to build: ${pkgs[*]}"

          export PKG_COUNT=0
          export FAIL_COUNT=0

          # Parallel execution of package builds
          for pkg in "${pkgs[@]}"; do
            (
              echo "🏗️ Building $pkg for ${{ matrix.config.arch }}..."
              if [[ "${{ matrix.config.host }}" == "${{ matrix.config.arch }}" ]]; then
                if ! sudo -Eu builder ./xbps-src -f pkg -j$(nproc) -A ${{ matrix.config.host }} "$pkg"; then
                  echo "❌ Failed building: $pkg"
                  exit 1
                fi
              else
                if ! sudo -Eu builder ./xbps-src -f pkg -j$(nproc) -a ${{ matrix.config.arch }} -A ${{ matrix.config.host }} "$pkg"; then
                  echo "❌ Failed building: $pkg"
                  exit 1
                fi
              fi
              echo "✅ Success: $pkg"
            ) &
          done

          wait

          # Count results
          PKG_COUNT=$(ls hostdir/binpkgs/*.xbps 2>/dev/null | wc -l || echo 0)
          echo "package_count=$PKG_COUNT" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(git rev-parse --short ${SHA})" >> $GITHUB_OUTPUT

      - name: Check build status
        if: steps.build.outputs.package_count == 0
        run: |
          echo "No packages were built successfully."
          exit 1

      - name: Clean & sign
        working-directory: ./hostdir/binpkgs
        env:
          PRIVKEY: ${{ secrets.PRIV_KEY }}
          XBPS_PASSPHRASE: ${{ secrets.SIGN_PASS }}
        run: |
          set -e
          sudo -Eu builder xbps-rindex --remove-obsoletes "${PWD}"

          if [ -n "${PRIVKEY}" ]; then
            printf "%s\n" "${PRIVKEY}" > key.pem
            sudo -Eu builder xbps-rindex --privkey key.pem --sign --signedby "${REPO_NAME}-github-actions" --verbose "${PWD}"
            sudo -Eu builder xbps-rindex --privkey key.pem --sign-pkg --verbose "${PWD}"/*.xbps
            sudo -Eu builder rm -f key.pem
          else
            echo "ℹ️ No PRIV_KEY found. Skipping cryptographic signing."
          fi

          sudo -Eu builder xbps-rindex --clean "${PWD}"

      - name: Generate checksums
        working-directory: ./hostdir/binpkgs
        run: |
          rm -rf *.sha256sum *.sha512sum
          count=$(ls -1 *.xbps 2>/dev/null | wc -l)
          if [ "$count" -gt 0 ]; then
            sha256sum *.xbps | awk '{print $1}' > sha256sums.txt
            cat sha256sums.txt | while read sum; do
              file=$(grep " $sum$" sha256sums.txt | head -n1 | sed "s| $sum$||")
              echo "$sum" > "${file}.sha256sum"
            done
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.arch }}-repodata
          path: ./hostdir/binpkgs

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.SHORT_SHA }}
          tag_name: ${{ env.TAG }}
          files: |
            ./hostdir/binpkgs/*.xbps
            ./hostdir/binpkgs/*.sig2
            ./hostdir/binpkgs/*repodata
