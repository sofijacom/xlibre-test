name: Test XLibre VOID linux

env:
  TAG: workflow-${{ github.run_number }}
  SHA: ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - srcpkgs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 📦 ${{ matrix.config.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        config:
          # Оставим только целевые архитектуры из вашего запроса
          - { arch: x86_64,       host: x86_64,      libc: glibc, platform: linux/amd64, test: 1 }
          - { arch: aarch64,      host: x86_64,      libc: glibc, platform: linux/amd64, test: 0 }
          - { arch: aarch64-musl, host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 0 }
  
    container:
      image: ghcr.io/void-linux/void-glibc-full:current # Используем конкретный существующий тег 'current'
      options: --platform linux/amd64 --privileged
      volumes:
        - /dev:/dev
      env:
        TAG: '${{ env.TAG }}'
        SHA: '${{ env.SHA }}'
        ARCH: '${{ matrix.config.arch }}'
        XBPS_TARGET_ARCH: '${{ matrix.config.arch }}'
        REPO_OWNER: "${{ github.repository_owner }}"
        REPO_NAME: "${{ github.event.repository.name }}"
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout and setup repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Prepare workspace permissions
        run: |
          chown -R runner:docker .
          
      - name: Merge fork into void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add myfork https://github.com/"$REPO_OWNER"/"$REPO_NAME".git || true
          git fetch myfork main --depth=100
          git merge --no-commit --strategy-recursive -Xtheirs myfork/main || true
          
          mkdir -p hostdir/binpkgs
          rm -f hostdir/binpkgs/*.xbps.sig2
          
          cd hostdir/binpkgs || exit 1
          for f in *-"$ARCH"*; do
            [ -e "$f" ] || continue
            case "$ARCH" in
              x86_64) echo "$f" | grep -q -- '-musl\.' && rm -f -- "$f" ;;
              aarch64) echo "$f" | grep -q -- '-musl\.' && rm -f -- "$f" ;;
            esac
          done
          cd - > /dev/null || exit 1

      - name: Prepare system repositories and install tools
        run: |
          env -u XBPS_TARGET_ARCH xbps-install -Syu xbps
          useradd -G xbuilder -M builder -s /bin/sh
            
          # Устанавливаем xtools (содержит xbps-src cross-tools) и другие зависимости
          env -u XBPS_TARGET_ARCH xbps-install -y bash curl grep jq git zip unzip github-cli xtools ca-certificates
            
      - name: Identify changes to build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_HEAD=$(git rev-parse HEAD)
          latest_name=$(gh release view --json tagName --jq '.tagName' --repo "$REPO_OWNER/$REPO_NAME" 2>/dev/null || echo "")
          
          if [ -n "$latest_name" ]; then
            base_sha=$(git rev-list -n 1 "$latest_name")
          else
            base_sha=$(git rev-list --max-parents=0 myfork/main)
          fi
          
          echo "🔍 Comparing $base_sha -> $CURRENT_HEAD"
          echo "📁 Contents of ./srcpkgs/:"
          ls -la srcpkgs/
          
          changed=$(git diff-tree --no-commit-id --name-only -r "$base_sha".."$CURRENT_HEAD" -- 'srcpkgs/')
          
          if [ -n "$changed" ]; then
            echo "$changed" | cut -d/ -f 2 | sort -u | su -s /bin/sh builder -c "./xbps-src sort-dependencies" | tee /tmp/templates
          else
            echo "⚠️ No package templates found in the diff."
            touch /tmp/templates
          fi

      - name: Setup void-packages environment
        run: |
          chown -R builder:builder .
          rm -f etc/conf
          cp etc/defaults.conf etc/conf
          echo "XBPS_CHROOT_CMD=uchroot" >> etc/conf
          echo "XBPS_USE_MOUNTFS=no" >> etc/conf
          
          export XBPS_CHROOT_CMD=uchroot
          export XBPS_USE_MOUNTFS=no
          export XBPS_REPOSITORY="https://repo-default.voidlinux.org/current"
          
          if [ "${{ matrix.config.host }}" != "${{ matrix.config.arch }}" ]; then
            echo "🚜 Bootstrapping CROSS toolchain for ${{ matrix.config.arch }}..."
            # Для кросс-компиляции обязательно указываем хост через -A
            yes | su -s /bin/sh builder -c "./xbps-src -a \"${{ matrix.config.arch }}\" -A \"${{ matrix.config.host }}\" binary-bootstrap"
          else
            echo "🖥️ Bootstrapping NATIVE toolchain for ${{ matrix.config.arch }}..."
            yes | su -s /bin/sh builder -c "./xbps-src -A \"${{ matrix.config.host }}\" binary-bootstrap"
          fi

      - name: Build pkgs     
        id: build
        run: |
          chown -R builder:builder .
          
          if [ ! -s /tmp/templates ]; then
            echo "❌ FATAL ERROR: Template list is empty after all checks."
            echo "--- DEBUG INFO ---"
            pwd
            ls -la
            cat /tmp/templates || echo "(file missing)"
            echo "------------------"
            exit 1
          fi
          
          pkgs=""
          while IFS= read -r line; do
            pkgs="$pkgs $line"
          done < /tmp/templates
          
          BUILD_ENV="export XBPS_CHROOT_CMD=uchroot && export XBPS_USE_MOUNTFS=no && export XBPS_REPOSITORY=$XBPS_REPOSITORY && "
          
          SUCCESS_COUNT=0
          TOTAL_COUNT=0
          
          for pkg in $pkgs; do
            TOTAL_COUNT=$((TOTAL_COUNT + 1))
            CMD="./xbps-src -f pkg -j$(nproc) -A \"${{ matrix.config.host }}\" \"$pkg\""
            
            if [ "${{ matrix.config.host }}" != "${{ matrix.config.arch }}" ]; then
              CMD="./xbps-src -f pkg -j$(nproc) -a \"${{ matrix.config.arch }}\" -A \"${{ matrix.config.host }}\" \"$pkg\""
            fi
            
            echo "🏗️ Starting build for: $pkg"
            if su -s /bin/sh builder -c "$BUILD_ENV $CMD"; then
              echo "✅ Success: $pkg"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              echo "❌ CRITICAL FAILURE building: $pkg"
              exit 1
            fi
          done
          
          echo "build-success-count=$SUCCESS_COUNT" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(git rev-parse --short "$SHA")" >> $GITHUB_OUTPUT

      - name: Check build status
        if: steps.build.outputs.build-success-count == '0'
        run: |
          echo "No packages were built successfully."
          exit 1

      - name: Clean & sign
        working-directory: ./hostdir/binpkgs
        env:
          PRIVKEY: ${{ secrets.PRIV_KEY }}
          XBPS_PASSPHRASE: ${{ secrets.SIGN_PASS }}
        run: |
          set -e
          if [ ! -f "*.xbps" ] 2>/dev/null; then
            echo "No .xbps files found. Skipping index/signing."
            exit 0
          fi
          su -s /bin/sh builder -c "xbps-rindex --remove-obsoletes \".\""
          if [ -n "$PRIVKEY" ]; then
            printf "%s\n" "$PRIVKEY" > key.pem
            su -s /bin/sh builder -c "xbps-rindex --privkey key.pem --sign --signedby \"${REPO_NAME}-github-actions\" --verbose \".\""
            su -s /bin/sh builder -c "xbps-rindex --privkey key.pem --sign-pkg --verbose ./*.xbps"
            su -s /bin/sh builder -c "rm -f key.pem"
          fi
          su -s /bin/sh builder -c "xbps-rindex --clean \".\""

      - name: Generate checksums
        working-directory: ./hostdir/binpkgs
        run: |
          rm -rf *.sha256sum *.sha512sum
          count=$(echo *.xbps 2>/dev/null)
          if [ "$count" != "*.xbps" ]; then
            for file in *.xbps; do
              sha256sum "$file" | awk '{print $1}' > "${file}.sha256sum"
            done
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.arch }}-repodata
          path: ./hostdir/binpkgs

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.SHORT_SHA }}
          tag_name: ${{ env.TAG }}
          files: |
            ./hostdir/binpkgs/*.xbps
            ./hostdir/binpkgs/*.sig2
            ./hostdir/binpkgs/*repodata
