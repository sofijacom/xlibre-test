name: Test XLibre VOID linux

env:
  TAG: workflow-${{ github.run_number }}
  SHA: ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - srcpkgs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 📦 ${{ matrix.config.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        config:
          - { arch: x86_64,       host: x86_64,      libc: glibc, platform: linux/amd64, test: 1 }
          - { arch: i686,         host: i686,        libc: glibc, platform: linux/386,   test: 1 }
          - { arch: aarch64,      host: x86_64,      libc: glibc, platform: linux/amd64, test: 0 }
          - { arch: armv7l,       host: x86_64,      libc: glibc, platform: linux/amd64, test: 0 }
          - { arch: x86_64-musl,  host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 1 }
          - { arch: armv6l-musl,  host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 0 }
          - { arch: aarch64-musl, host: x86_64-musl, libc: musl,  platform: linux/amd64, test: 0 }
  
    container:
      image: ghcr.io/void-linux/void-glibc-full
      options: --platform linux/amd64 --privileged
      volumes:
        - /dev:/dev
      env:
        TAG: '${{ env.TAG }}'
        SHA: '${{ env.SHA }}'
        ARCH: '${{ matrix.config.arch }}'
        XBPS_TARGET_ARCH: '${{ matrix.config.arch }}'
        REPO_OWNER: "${{ github.repository_owner }}"
        REPO_NAME: "${{ github.event.repository.name }}"
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Prepare container and switch to master branch
        run: |
          xbps-pkgdb --repository-mode master void || true
          
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          env -u XBPS_TARGET_ARCH xbps-install -Syu xbps
          env -u XBPS_TARGET_ARCH xbps-install -yu
          env -u XBPS_TARGET_ARCH xbps-install -y bash curl grep jq git xz zip unzip github-cli xtools
          useradd -G xbuilder -M builder -s /bin/sh
            
      - name: Checkout xlibre
        uses: actions/checkout@v6
        with:
          repository: void-linux/void-packages
          ref: master

      - name: Merge this repository into void-linux/void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "*"
          git remote add -f "$REPO_OWNER" https://github.com/"$REPO_OWNER"/"$REPO_NAME".git
          git merge --no-commit --strategy-option=theirs --allow-unrelated-histories -Xignore-space-change "$REPO_OWNER"/main
          mkdir -p hostdir/binpkgs
          
          if gh release view "$TAG" --repo "$REPO_OWNER/$REPO_NAME" &>/dev/null; then
            gh release download "$TAG" --pattern "*${ARCH}*" --dir hostdir/binpkgs --repo "$REPO_OWNER/$REPO_NAME" || true
          fi
          
          rm -f hostdir/binpkgs/*.xbps.sig2
          
          cd hostdir/binpkgs || exit 1
          for f in *-"$ARCH"*; do
            [ -e "$f" ] || continue
            case "$ARCH" in
              x86_64) 
                echo "$f" | grep -q -- '-musl\.' && rm -f -- "$f" ;;
              x86_64-musl) 
                echo "$f" | grep -q -- '^x86_64[^m]' && rm -f -- "$f" ;;
              aarch64) 
                echo "$f" | grep -q -- '-musl\.' && rm -f -- "$f" ;;
              aarch64-musl) 
                echo "$f" | grep -q -- '^aarch64[^m]' && rm -f -- "$f" ;;
            esac
          done
          cd - > /dev/null || exit 1

      - name: Identify changes to build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_name=$(gh release view --json tagName --jq '.tagName' --repo "$REPO_OWNER/$REPO_NAME" || echo "Initial Commit")
          latest_sha=$(git rev-list --max-count=1 "$latest_name" 2>/dev/null || git rev-list --max-parents=0 "$REPO_OWNER/main")
          echo "Latest Tag Name: $latest_name"
          echo "Latest Tag SHA: $latest_sha"

          chown -R builder:builder .

          # Проверяем, существует ли директория srcpkgs перед поиском
          if [ ! -d "srcpkgs" ]; then
            echo "Directory srcpkgs not found!"
            touch /tmp/templates
          else
            git diff-tree -r --no-renames --name-only --diff-filter=AM "$latest_sha" "$SHA" -- 'srcpkgs/**' \
            | cut -d/ -f 2 | sort -u | su -s /bin/sh builder -c "./xbps-src sort-dependencies" | tee /tmp/templates
          fi

      - name: Setup void-packages and Toolchain
        run: |
          chown -R builder:builder .
          rm -f etc/conf
          cp etc/defaults.conf etc/conf
          echo "XBPS_CHROOT_CMD=uchroot" >> etc/conf
          echo "XBPS_USE_MOUNTFS=no" >> etc/conf
          
          export XBPS_CHROOT_CMD=uchroot
          export XBPS_USE_MOUNTFS=no
          export XBPS_REPOSITORY="https://repo-default.voidlinux.org/current"
          
          if [ "${{ matrix.config.host }}" != "${{ matrix.config.arch }}" ]; then
            echo "🚜 Bootstrapping cross-toolchain for ${{ matrix.config.arch }}..."
            yes | su -s /bin/sh builder -c "./xbps-src -a \"${{ matrix.config.arch }}\" -A \"${{ matrix.config.host }}\" binary-bootstrap"
          else
            echo "🖥️ Bootstrapping native toolchain for ${{ matrix.config.arch }}..."
            yes | su -s /bin/sh builder -c "./xbps-src -A \"${{ matrix.config.host }}\" binary-bootstrap"
          fi

      - name: Build pkgs     
        id: build
        run: |
          chown -R builder:builder .
          
          # Явно проверяем наличие шаблонов
          if [ ! -s /tmp/templates ]; then
            echo "❌ ERROR: Template list is empty (/tmp/templates). Nothing to build."
            echo "This usually means no files changed in srcpkgs/ or the previous step failed silently."
            exit 1
          fi
          
          pkgs=""
          while IFS= read -r line; do
            pkgs="$pkgs $line"
          done < /tmp/templates
          
          echo "Found packages to build:$pkgs"
          
          BUILD_ENV="export XBPS_CHROOT_CMD=uchroot && export XBPS_USE_MOUNTFS=no && export XBPS_REPOSITORY=$XBPS_REPOSITORY && "
          
          SUCCESS_COUNT=0
          TOTAL_COUNT=0
          
          for pkg in $pkgs; do
            TOTAL_COUNT=$((TOTAL_COUNT + 1))
            (
              echo "🏗️ Building $pkg for ${{ matrix.config.arch }}..."
              
              if [ "${{ matrix.config.host }}" = "${{ matrix.config.arch }}" ]; then
                CMD="./xbps-src -f pkg -j$(nproc) -A \"${{ matrix.config.host }}\" \"$pkg\""
              else
                CMD="./xbps-src -f pkg -j$(nproc) -a \"${{ matrix.config.arch }}\" -A \"${{ matrix.config.host }}\" \"$pkg\""
              fi
              
              if su -s /bin/sh builder -c "$BUILD_ENV $CMD"; then
                echo "✅ Success: $pkg"
                SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              else
                echo "❌ CRITICAL FAILURE building: $pkg"
                exit 1
              fi
            )
            wait $! # Ждем завершения текущего процесса, чтобы падать немедленно
          done
          
          echo "build-success-count=$SUCCESS_COUNT" >> $GITHUB_OUTPUT
          echo "build-total-count=$TOTAL_COUNT" >> $GITHUB_OUTPUT
          
          SHORT_SHA=$(git rev-parse --short "$SHA")
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Check build status
        if: steps.build.outputs.build-success-count == '0'
        run: |
          echo "No packages were built successfully."
          exit 1

      - name: Clean & sign
        working-directory: ./hostdir/binpkgs
        env:
          PRIVKEY: ${{ secrets.PRIV_KEY }}
          XBPS_PASSPHRASE: ${{ secrets.SIGN_PASS }}
        run: |
          set -e
          # Выходим, если папка пуста, чтобы не ломать индексацию
          if [ ! -f "*.xbps" ] 2>/dev/null; then
            echo "No .xbps files found. Skipping index/signing."
            exit 0
          fi
          
          su -s /bin/sh builder -c "xbps-rindex --remove-obsoletes \".\""
          
          if [ -n "$PRIVKEY" ]; then
            printf "%s\n" "$PRIVKEY" > key.pem
            su -s /bin/sh builder -c "xbps-rindex --privkey key.pem --sign --signedby \"${REPO_NAME}-github-actions\" --verbose \".\""
            su -s /bin/sh builder -c "xbps-rindex --privkey key.pem --sign-pkg --verbose ./*.xbps"
            su -s /bin/sh builder -c "rm -f key.pem"
          fi
          
          su -s /bin/sh builder -c "xbps-rindex --clean \".\""

      - name: Generate checksums
        working-directory: ./hostdir/binpkgs
        run: |
          rm -rf *.sha256sum *.sha512sum
          count=$(echo *.xbps 2>/dev/null)
          if [ "$count" != "*.xbps" ]; then
            for file in *.xbps; do
              sha256sum "$file" | awk '{print $1}' > "${file}.sha256sum"
            done
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.arch }}-repodata
          path: ./hostdir/binpkgs

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.SHORT_SHA }}
          tag_name: ${{ env.TAG }}
          files: |
            ./hostdir/binpkgs/*.xbps
            ./hostdir/binpkgs/*.sig2
            ./hostdir/binpkgs/*repodata
